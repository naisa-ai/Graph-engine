name: Graph-Engine CI

on:
  push:
  workflow_dispatch:

run-name: "${{ github.workflow }} - ${{ github.ref_name }} (${{ github.sha }})"

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: 856567682521.dkr.ecr.us-west-1.amazonaws.com
  DOCKERFILE_PATH: Dockerfile
  SERVICE_NAME: graph-engine

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.tags.outputs.sha_short }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      branch_sha_tag: ${{ steps.tags.outputs.branch_sha_tag }}
    steps:
      - name: Prepare image tags
        id: tags
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_TAG=$(echo "${BRANCH_NAME}" | sed 's/\//-/g')
          SHA_SHORT="${GITHUB_SHA::7}"
          BRANCH_SHA_TAG="${BRANCH_TAG}-${SHA_SHORT}"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_sha_tag=${BRANCH_SHA_TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

      - name: Build and push (${{ matrix.arch }})
        run: |
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --cache-from type=gha,scope=${SERVICE_NAME}-${{ matrix.arch }} \
            --cache-to type=gha,scope=${SERVICE_NAME}-${{ matrix.arch }},mode=max \
            --provenance=false \
            -t "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-${{ matrix.arch }}" \
            --push \
            -f "${DOCKERFILE_PATH}" \
            .

  manifest:
    name: Create Multi-Arch Manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

      - name: Create and push multi-arch manifests
        run: |
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          BRANCH_TAG="${{ needs.prepare.outputs.branch_tag }}"
          BRANCH_SHA_TAG="${{ needs.prepare.outputs.branch_sha_tag }}"
          docker manifest create "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-amd64" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-arm64"
          docker manifest push "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}"
          docker manifest create "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_SHA_TAG}" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-amd64" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-arm64"
          docker manifest push "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_SHA_TAG}"
          docker manifest create --amend "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_TAG}" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-amd64" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-arm64"
          docker manifest push "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_TAG}"

          echo "## Image" >> $GITHUB_STEP_SUMMARY
          echo "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_SHA_TAG}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Trigger Auto-Deploy
    needs: [prepare, manifest]
    if: false # disabled — using scheduled-deploy in sre-deployment. Change to: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sre-deployment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SOURCE_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "${{ needs.prepare.outputs.branch_sha_tag }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg committer "${{ github.actor }}" \
            --arg msg "$SOURCE_COMMIT_MSG" \
            '{
              event_type: "deploy-image",
              client_payload: {
                source_repo: $repo,
                image_tag: $tag,
                source_commit_url: $url,
                source_committer: $committer,
                source_commit_message: $msg
              }
            }')
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/naisa-ai/sre-deployment/dispatches \
            -d "$PAYLOAD"
