name: Graph-Engine CI

on:
  push:
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit SHA to build (defaults to the dispatch ref's HEAD). Used by
          maya's testbed suite to build the exact commit that passed tests,
          which may be behind the current tip of main.
        required: false
        type: string
      tag_latest_good:
        description: >-
          Also tag the resulting multi-arch image latest-good in ECR. Used
          for commits that have passed the Maya testbed test stage.
        required: false
        default: false
        type: boolean

run-name: >-
  ${{ github.workflow }} - ${{ github.ref_name }}
  (${{ github.event.inputs.sha || github.sha }})

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: 856567682521.dkr.ecr.us-west-1.amazonaws.com
  DOCKERFILE_PATH: Dockerfile
  SERVICE_NAME: graph-engine

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      resolved_sha: ${{ steps.tags.outputs.resolved_sha }}
      sha_short: ${{ steps.tags.outputs.sha_short }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      branch_sha_tag: ${{ steps.tags.outputs.branch_sha_tag }}
      image_exists: ${{ steps.check_existing.outputs.image_exists }}
    steps:
      - name: Prepare image tags
        id: tags
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          RESOLVED_SHA="${INPUT_SHA:-$GITHUB_SHA}"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_TAG=$(echo "${BRANCH_NAME}" | sed 's/\//-/g')
          SHA_SHORT="${RESOLVED_SHA:0:7}"
          BRANCH_SHA_TAG="${BRANCH_TAG}-${SHA_SHORT}"
          echo "resolved_sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_sha_tag=${BRANCH_SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (for ECR existence check)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if this commit was already built
        id: check_existing
        run: |
          SHA_SHORT="${{ steps.tags.outputs.sha_short }}"
          if aws ecr describe-images \
              --repository-name "${SERVICE_NAME}" \
              --region "${AWS_REGION}" \
              --image-ids imageTag="${SHA_SHORT}" >/dev/null 2>&1; then
            echo "Image ${SERVICE_NAME}:${SHA_SHORT} already exists in ECR — skipping build."
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image ${SERVICE_NAME}:${SHA_SHORT} not found in ECR — proceeding with a full build."
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.image_exists != 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.resolved_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

      - name: Build and push (${{ matrix.arch }})
        run: |
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --cache-from type=gha,scope=${SERVICE_NAME}-${{ matrix.arch }} \
            --cache-to type=gha,scope=${SERVICE_NAME}-${{ matrix.arch }},mode=max \
            --provenance=false \
            -t "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-${{ matrix.arch }}" \
            --push \
            -f "${DOCKERFILE_PATH}" \
            .

  manifest:
    name: Create Multi-Arch Manifest
    needs: [prepare, build]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        if: ${{ needs.prepare.outputs.image_exists != 'true' }}
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login \
            --username AWS \
            --password-stdin "${ECR_REGISTRY}"

      - name: Create and push multi-arch manifests
        if: ${{ needs.prepare.outputs.image_exists != 'true' }}
        run: |
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          BRANCH_TAG="${{ needs.prepare.outputs.branch_tag }}"
          BRANCH_SHA_TAG="${{ needs.prepare.outputs.branch_sha_tag }}"
          docker manifest create "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-amd64" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-arm64"
          docker manifest push "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}"
          docker manifest create "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_SHA_TAG}" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-amd64" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-arm64"
          docker manifest push "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_SHA_TAG}"
          docker manifest create --amend "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_TAG}" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-amd64" \
            "${ECR_REGISTRY}/${SERVICE_NAME}:${SHA_SHORT}-arm64"
          docker manifest push "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_TAG}"

          echo "## Image" >> $GITHUB_STEP_SUMMARY
          echo "${ECR_REGISTRY}/${SERVICE_NAME}:${BRANCH_SHA_TAG}" >> $GITHUB_STEP_SUMMARY

      - name: Note reused image
        if: ${{ needs.prepare.outputs.image_exists == 'true' }}
        run: |
          echo "## Image" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ needs.prepare.outputs.sha_short }}\` already existed in ECR — reused, nothing rebuilt." >> $GITHUB_STEP_SUMMARY

      - name: Tag latest-good (tested commit only)
        if: ${{ github.event.inputs.tag_latest_good == 'true' }}
        run: |
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          manifest_file="$(mktemp)"
          aws ecr batch-get-image \
            --repository-name "${SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --image-ids imageTag="${SHA_SHORT}" \
            --query 'images[0].imageManifest' --output text > "${manifest_file}"
          media_type="$(aws ecr batch-get-image \
            --repository-name "${SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --image-ids imageTag="${SHA_SHORT}" \
            --query 'images[0].imageManifestMediaType' --output text)"
          aws ecr put-image \
            --repository-name "${SERVICE_NAME}" \
            --region "${AWS_REGION}" \
            --image-tag latest-good \
            --image-manifest "file://${manifest_file}" \
            --image-manifest-media-type "${media_type}" \
            >/dev/null

          echo "- \`${ECR_REGISTRY}/${SERVICE_NAME}:latest-good\` -> commit \`${{ needs.prepare.outputs.resolved_sha }}\` (tests passed in maya's testbed suite)" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Trigger Auto-Deploy
    needs: [prepare, manifest]
    if: false # disabled — using scheduled-deploy in sre-deployment. Change to: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sre-deployment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SOURCE_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "${{ needs.prepare.outputs.branch_sha_tag }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg committer "${{ github.actor }}" \
            --arg msg "$SOURCE_COMMIT_MSG" \
            '{
              event_type: "deploy-image",
              client_payload: {
                source_repo: $repo,
                image_tag: $tag,
                source_commit_url: $url,
                source_committer: $committer,
                source_commit_message: $msg
              }
            }')
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/naisa-ai/sre-deployment/dispatches \
            -d "$PAYLOAD"
