version: '3.8'

# =============================================================================
# E2E Test Docker Compose
# =============================================================================
# Uses pre-built base images for faster builds. Run these first:
#   make e2e-base    # Build all e2e base images
#
# Or build individually:
#   make docker-base        # Server base image
#   make e2e-go-base        # Go client base image  
#   make e2e-py-base        # Python client base image
# =============================================================================

services:
  # Graph-engine service under test (uses cached base image)
  graph-engine:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
      args:
        BASE_IMAGE: graph-engine-base:latest
    ports:
      - "50051:50051"
    environment:
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "/app/graph-engined", "--help"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - e2e-network

  # E2E test client (raw gRPC)
  e2e-client:
    build:
      context: ..
      dockerfile: e2e/client/Dockerfile
      args:
        BASE_IMAGE: graph-engine-e2e-go-base:latest
    depends_on:
      graph-engine:
        condition: service_healthy
    environment:
      - GRAPH_ENGINE_ADDR=graph-engine:50051
    networks:
      - e2e-network
    profiles:
      - grpc
      - all

  # E2E test client using Go client library
  e2e-go-client:
    build:
      context: ..
      dockerfile: e2e/go-client/Dockerfile
      args:
        BASE_IMAGE: graph-engine-e2e-go-base:latest
    depends_on:
      graph-engine:
        condition: service_healthy
    environment:
      - GRAPH_ENGINE_ADDR=graph-engine:50051
    networks:
      - e2e-network
    profiles:
      - go
      - all

  # E2E test client using Python client library
  e2e-py-client:
    build:
      context: ..
      dockerfile: e2e/py-client/Dockerfile
      args:
        BASE_IMAGE: graph-engine-e2e-py-base:latest
    depends_on:
      graph-engine:
        condition: service_healthy
    environment:
      - GRAPH_ENGINE_ADDR=graph-engine:50051
    networks:
      - e2e-network
    profiles:
      - py
      - all

networks:
  e2e-network:
    driver: bridge
